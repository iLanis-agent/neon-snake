<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake - the classic, rewired</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:#030812; color:#dff6ff; min-height:100vh; }
  .wrap { max-width:560px; margin:0 auto; padding:18px 14px 50px; }
  h1 { font-size:22px; font-weight:800; text-align:center; }
  h1 .n { color:#22d3ee; text-shadow:0 0 14px #22d3ee; }
  .tag { text-align:center; color:#4e7d9c; font-size:12px; margin:4px 0 12px; }
  .hud { display:flex; justify-content:space-between; background:#071524; border:1px solid #0e2c42; border-radius:11px; padding:10px 16px; margin-bottom:12px; font-variant-numeric:tabular-nums; }
  .hud .c { text-align:center; }
  .hud .k { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:#4e7d9c; }
  .hud .v { font-size:20px; font-weight:800; }
  #boardbox { position:relative; background:#020610; border:1px solid #0e2c42; border-radius:14px; overflow:hidden; touch-action:none; }
  canvas { display:block; width:100%; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:12px; background:rgba(2,6,16,.82); text-align:center; padding:20px; }
  #overlay h2 { font-size:26px; }
  #overlay p { color:#4e7d9c; font-size:14px; }
  .bigbtn { background:linear-gradient(135deg,#22d3ee,#0369a1); border:none; color:#fff; font-size:16px; font-weight:700; padding:12px 36px; border-radius:11px; cursor:pointer; box-shadow:0 0 24px #22d3ee55; }
  .keys { display:none; grid-template-columns:repeat(3,64px); gap:8px; justify-content:center; margin-top:14px; }
  .keys button { background:#071524; border:1px solid #0e2c42; color:#dff6ff; font-size:20px; padding:12px 0; border-radius:10px; cursor:pointer; }
  @media (pointer:coarse) { .keys { display:grid; } }
  footer { text-align:center; color:#274b66; font-size:12px; margin-top:22px; }
  footer a { color:#4e7d9c; text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="n">&#12336;</span> Neon Snake</h1>
  <p class="tag">arrows or swipe - eat, grow, don't kiss the walls</p>
  <div class="hud">
    <div class="c"><div class="k">score</div><div class="v" id="score">0</div></div>
    <div class="c"><div class="k">speed</div><div class="v" id="speed">1x</div></div>
    <div class="c"><div class="k">best</div><div class="v" id="best">0</div></div>
  </div>
  <div id="boardbox"><canvas id="cv"></canvas>
    <div id="overlay"><h2>Neon Snake</h2><p>Eat the glowing orbs. Every five, the grid speeds up.</p><button class="bigbtn" id="start">Play</button></div>
  </div>
  <div class="keys">
    <span></span><button data-d="0,-1">&#9650;</button><span></span>
    <button data-d="-1,0">&#9664;</button><button data-d="0,1">&#9660;</button><button data-d="1,0">&#9654;</button>
  </div>
  <footer><a href="index.html">&#8592; About</a> &nbsp;|&nbsp; Neon Snake &middot; idea #8 from the iLanis App Factory</footer>
</div>
<script>
var N=21, cv=document.getElementById('cv'), g=cv.getContext('2d');
var S={snake:[],dir:{x:1,y:0},queue:[],food:null,score:0,best:0,alive:false,acc:0,last:0};
try{S.best=parseInt(localStorage.getItem('neonsnake-best')||'0',10);}catch(_){}
function el(id){return document.getElementById(id);}
el('best').textContent=S.best;
function size(){ var w=Math.min(520,document.getElementById('boardbox').clientWidth); cv.width=w; cv.height=w; }
function place(){ while(true){ var f={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};
  if(!S.snake.some(function(s){return s.x===f.x&&s.y===f.y;})){S.food=f;return;} } }
function reset(){ S.snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}]; S.dir={x:1,y:0}; S.queue=[]; S.score=0; S.acc=0; S.alive=true; place(); hud(); }
function hud(){ el('score').textContent=S.score; el('speed').textContent=(1+Math.floor(S.score/5)*0.25).toFixed(2).replace(/\.?0+$/,'')+'x'; el('best').textContent=S.best; }
function stepInt(){ return Math.max(55, 150-Math.floor(S.score/5)*20); }
function turn(x,y){ var d={x:x,y:y}, l=S.queue.length?S.queue[S.queue.length-1]:S.dir;
  if(d.x===-l.x&&d.y===-l.y)return; if(d.x===l.x&&d.y===l.y)return;
  if(S.queue.length<3)S.queue.push(d); }
function step(){
  if(S.queue.length)S.dir=S.queue.shift();
  var h={x:S.snake[0].x+S.dir.x, y:S.snake[0].y+S.dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||S.snake.some(function(s){return s.x===h.x&&s.y===h.y;})){ die(); return; }
  S.snake.unshift(h);
  if(h.x===S.food.x&&h.y===S.food.y){ S.score++; hud(); place(); }
  else S.snake.pop();
}
function die(){
  S.alive=false;
  if(S.score>S.best){S.best=S.score; try{localStorage.setItem('neonsnake-best',String(S.best));}catch(_){}}
  hud();
  var o=el('overlay'); o.style.display='flex';
  o.innerHTML='<h2>'+S.score+' points</h2><p>'+(S.score>=S.best&&S.score>0?'new best':'best: '+S.best)+'</p><button class="bigbtn" id="again">Again</button>';
  document.getElementById('again').onclick=start;
}
function start(){ el('overlay').style.display='none'; reset(); }
el('start').onclick=start;
function loop(t){
  requestAnimationFrame(loop);
  if(!S.alive){ draw(); return; }
  if(!S.last)S.last=t;
  S.acc+=t-S.last; S.last=t;
  var iv=stepInt();
  while(S.acc>=iv){ step(); S.acc-=iv; if(!S.alive)break; }
  draw();
}
function draw(){
  var c=cv.width/N;
  g.fillStyle='#020610'; g.fillRect(0,0,cv.width,cv.height);
  g.strokeStyle='rgba(34,211,238,0.05)'; g.lineWidth=1;
  for(var i=1;i<N;i++){ g.beginPath();g.moveTo(i*c,0);g.lineTo(i*c,cv.height);g.stroke(); g.beginPath();g.moveTo(0,i*c);g.lineTo(cv.width,i*c);g.stroke(); }
  if(S.food){ var fx=(S.food.x+.5)*c, fy=(S.food.y+.5)*c, pu=1+Math.sin(Date.now()/200)*0.15;
    var fg=g.createRadialGradient(fx,fy,1,fx,fy,c*1.1);
    fg.addColorStop(0,'rgba(244,114,182,1)'); fg.addColorStop(0.4,'rgba(244,114,182,0.5)'); fg.addColorStop(1,'rgba(244,114,182,0)');
    g.fillStyle=fg; g.beginPath(); g.arc(fx,fy,c*0.9*pu,0,7); g.fill(); }
  S.snake.forEach(function(s,i){
    var a=1-i/S.snake.length*0.6;
    g.shadowColor='#22d3ee'; g.shadowBlur=i===0?14:6;
    g.fillStyle='rgba(34,211,238,'+a+')';
    var pad=i===0?1.5:2.5;
    g.beginPath();
    g.roundRect(s.x*c+pad, s.y*c+pad, c-2*pad, c-2*pad, 4);
    g.fill(); g.shadowBlur=0;
  });
}
document.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowUp'||k==='w')turn(0,-1);
  else if(k==='ArrowDown'||k==='s')turn(0,1);
  else if(k==='ArrowLeft'||k==='a')turn(-1,0);
  else if(k==='ArrowRight'||k==='d')turn(1,0);
  else return; e.preventDefault();
});
var ts=null;
document.getElementById('boardbox').addEventListener('pointerdown',function(e){ ts={x:e.clientX,y:e.clientY}; });
document.getElementById('boardbox').addEventListener('pointerup',function(e){
  if(!ts)return; var dx=e.clientX-ts.x, dy=e.clientY-ts.y; ts=null;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy)) turn(dx>0?1:-1,0); else turn(0,dy>0?1:-1);
});
document.querySelectorAll('.keys button').forEach(function(b){
  b.onclick=function(){ var d=b.dataset.d.split(','); turn(parseInt(d[0],10),parseInt(d[1],10)); };
});
window.addEventListener('resize',size);
size(); draw(); requestAnimationFrame(loop);
</script>
</body>
</html>
